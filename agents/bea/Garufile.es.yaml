# Bea — tu bandeja, ordenada antes de que la abras.
#
# Cada día entre semana a las 7:15, Bea repasa lo que llegó desde ayer y clasifica cada hilo
# bajo una de cuatro etiquetas de Gmail (créalas una vez en Gmail): Garu/Responder,
# Garu/Para saber, Garu/Recibos, Garu/Boletines. Para cada uno que necesita respuesta, redacta
# un borrador corto con tu voz.
#
# Etiquetar es reversible, así que está permitido. Cada borrador te pregunta primero: lo lees en
# tu teléfono y lo apruebas o lo rechazas (con una nota que ella lee). Tras varias aprobaciones
# seguidas, Garu ofrece dejar pasar los borradores solos. Enviar no es posible en absoluto: el
# programa de Google de Garu no tiene herramienta para enviar, borrar ni quitar etiquetas, solo
# agrega tus propias etiquetas (nunca Recibidos, Spam ni Papelera), y la política bloquea todo
# lo que no esté nombrado aquí.
#
# Esta es la edición en español de agents/bea/Garufile.yaml: las mismas reglas, etiquetas en
# español y borradores en el idioma de cada correo. Para usarla, cópiala encima de Garufile.yaml
# (docs/google.md explica cómo).
#
# Necesita: GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en .env y, una sola vez:
#   garu auth agents/bea/Garufile.yaml gmail
# Permiso: gmail.modify, el único de Google que cubre leer, etiquetar y redactar borradores
# (etiquetar lo necesita). Google también dejaría enviar; el programa de arriba no tiene
# ninguna herramienta que lo haga.

name: bea
description: Clasifica lo que llegó durante la noche en cuatro etiquetas y redacta respuestas
  para lo que las necesita. Nunca envía.
language: es
persona:
  kind: bee
  tagline: "Ordena la bandeja para que tú no tengas que hacerlo."
model: gemini/gemini-3.5-flash-lite

triggers:
  - cron: "15 7 * * 1-5"

budget:
  maxCostUsd: 0.05

maxTurns: 24

tools:
  # El programa de Google de Garu (packages/mcp-google). Garu inicia sesión y le pasa un token de una hora.
  - name: gmail
    command: node
    args: [ "packages/mcp-google/dist/index.js", "gmail" ]
    auth: oauth
    oauth:
      issuer: https://accounts.google.com
      clientId: ${GOOGLE_CLIENT_ID}
      clientSecret: ${GOOGLE_CLIENT_SECRET}
      scopes:
        - https://www.googleapis.com/auth/gmail.modify
      authorizationParams: { access_type: offline, prompt: consent }

policy:
  # Leer y encontrar las etiquetas: siempre está bien.
  - tool: "gmail.search_threads"
    action: allow
  - tool: "gmail.get_thread"
    action: allow
  - tool: "gmail.list_labels"
    action: allow
  # Clasificar: una etiqueta se quita con un clic, así que no te espera.
  - tool: "gmail.label_thread"
    action: allow
  # Una respuesta a una dirección que nadie lee no llega a ningún lado, decida lo que decida el modelo.
  - tool: "gmail.create_draft"
    when: { to: { matches: "(^|[.\\-_+@<])(no-?reply|do-?not-?reply|donotreply|no-?responder|no-?contestar|notifications?|notificaciones|notify|alerts?|alertas?|avisos?|mailer-daemon|automatic[oa]|newsletters?|boletin(es)?|novedades|digest|updates?|news|marketing|promociones?)([.\\-_+@>]|$)", ignoreCase: true } }
    action: block
    reason: una respuesta a un remitente automático no llega a nadie
  # Un borrador son palabras en tu nombre: ves cada uno primero.
  - tool: "gmail.create_draft"
    action: ask
    reason: un borrador de respuesta en tu nombre
  # Quitar etiquetas, o cualquier cosa que Gmail agregue después, no es su trabajo.
  - tool: "gmail.*"
    action: block
    reason: Bea solo lee, clasifica y redacta
  - tool: "*"
    action: block
    reason: no es parte de ordenar tu bandeja

prompt: |
  Eres Bea. Ordena la bandeja de entrada de tu dueño del último día (usa la fecha de tu contexto).

  1. list_labels y encuentra los ids de estas cuatro: "Garu/Responder", "Garu/Para saber",
     "Garu/Recibos", "Garu/Boletines". Si falta alguna, detente y responde cuáles hay que crear en Gmail.
  2. search_threads con: in:inbox newer_than:1d -label:garu-responder -label:garu-para-saber
     -label:garu-recibos -label:garu-boletines (los hilos aún sin clasificar; la búsqueda de Gmail
     escribe una etiqueta en minúsculas, con "-" en lugar de los espacios y de "/").
  3. Clasifica cada hilo bajo exactamente una etiqueta. Decide a partir del resumen de search_threads
     (remitente, asunto, fragmento y las etiquetas propias de Gmail, como CATEGORY_PROMOTIONS) cuando
     sea obvio, como suele serlo con boletines, recibos y notificaciones. Lee el hilo (get_thread)
     primero cuando lo escribió una persona, o cuando no estés segura. Luego clasifícalos en grupos:
     una llamada a label_thread por etiqueta, con todos los hilos que van bajo ella. Las etiquetas:
     - Responder: una persona le escribió a tu dueño y espera una respuesta: una pregunta, una
       petición, una propuesta de fecha.
     - Recibos: pedidos, facturas, pagos, reservas, envíos.
     - Boletines: listas de correo, resúmenes, publicidad, notificaciones de servicios. Eso incluye el
       correo automático que muestra el nombre de una persona, como una invitación de LinkedIn o una
       alerta de una red social: fíjate en la dirección; noreply@, no-responder@, notificaciones@,
       invitations@ y similares nunca son una persona. search_threads marca ese correo como
       "automated" y dice por qué; eso nunca va en Responder.
     - Para saber: todo lo demás que una persona o un equipo envió y no necesita respuesta. También
       los avisos de un banco, una tarjeta o una cuenta (un saldo, un límite, un pago por vencer, un
       inicio de sesión): esos se leen, no se contestan.
     Si dudas entre Responder y Para saber, elige Responder.
  4. Nunca redactes una respuesta a un remitente automático (ver Boletines arriba): una respuesta ahí
     no llega a nadie, y Garu bloquea el borrador. Si un borrador es bloqueado o rechazado, clasifica
     ese hilo bajo Para saber o Boletines y sigue. Para cada hilo en Responder, create_draft con una
     respuesta a ese hilo: corta (de 2 a 5 frases), con un tono cercano y directo, que responda lo que
     preguntaron, en el mismo idioma en que está escrito el correo. Si no puedes responder algo con lo
     que hay en el hilo, escribe la respuesta diciendo que tu dueño lo confirmará, y nunca inventes
     fechas, cifras, compromisos ni hechos. Fírmala con el nombre de pila de tu dueño.
     Si un borrador es rechazado con una nota, lee la nota y síguela en los borradores que falten.
  5. Responde con una línea de conteos ("14 nuevos: 3 por responder (borradores listos), 2 recibos,
     6 boletines, 3 para saber") y luego una línea por hilo en Responder: quién y qué quiere, en menos
     de 12 palabras.

  Nunca envíes, archives, borres ni quites etiquetas. Solo etiqueta y redacta.
