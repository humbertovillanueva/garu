# Tomay — your day, ready before you are.
#
# Every weekday at 7:00 Tomay reads today's calendar and, for each meeting with other
# people, looks up your recent email with them and writes a prep note: who's coming,
# what you last talked about, what's still open. It also lists your free blocks.
#
# It only reads. Google is asked for read-only access (the scopes below), Garu's Google
# program has no tool that changes the calendar or sends mail, and the policy blocks
# everything else, so even a wrong rule couldn't change anything. Its one write is today's brief, in its own folder. Nothing is posted anywhere:
# the brief stays on this computer and in Tomay's thread on your phone.
#
# Needs: GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in .env (your Google Cloud project's
# OAuth client), then once: garu auth agents/tomay/Garufile.yaml calendar
#                       and: garu auth agents/tomay/Garufile.yaml gmail

name: tomay
description: Reads today's calendar and writes a prep note for each meeting, from your recent email with the people in it.
persona:
  kind: fox
  tagline: "Gathers the morning and brings it to you."
model: gemini/gemini-3.5-flash-lite

triggers:
  - cron: "0 7 * * 1-5"

budget:
  maxCostUsd: 0.05

maxTurns: 14

tools:
  # Garu's own Google program (packages/mcp-google). Garu signs in and hands it a one-hour token.
  - name: calendar
    command: node
    args: ["packages/mcp-google/dist/index.js", "calendar"]
    auth: oauth
    oauth:
      issuer: https://accounts.google.com
      clientId: ${GOOGLE_CLIENT_ID}
      clientSecret: ${GOOGLE_CLIENT_SECRET}
      scopes:
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
        - https://www.googleapis.com/auth/calendar.events.readonly
      authorizationParams: { access_type: offline, prompt: consent }
  - name: gmail
    command: node
    args: ["packages/mcp-google/dist/index.js", "gmail"]
    auth: oauth
    oauth:
      issuer: https://accounts.google.com
      clientId: ${GOOGLE_CLIENT_ID}
      clientSecret: ${GOOGLE_CLIENT_SECRET}
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
      authorizationParams: { access_type: offline, prompt: consent }
  - name: fs
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./agents/tomay/briefs"]

policy:
  # Calendar: read only. Creating, changing, deleting or answering an event is someone else's job.
  - tool: "calendar.list_calendars"
    action: allow
  - tool: "calendar.list_events"
    action: allow
  - tool: "calendar.get_event"
    action: allow
  - tool: "calendar.*"
    action: block
    reason: Tomay only reads your calendar
  # Gmail: search and read, to know what you last discussed with each person. No labels, no drafts.
  - tool: "gmail.search_threads"
    action: allow
  - tool: "gmail.get_thread"
    action: allow
  - tool: "gmail.*"
    action: block
    reason: Tomay only reads your email
  # Files: only today's brief, in its own folder.
  - tool: "fs.list_*"
    action: allow
  - tool: "fs.read_*"
    action: allow
  - tool: "fs.write_file"
    action: allow
    when:
      path: { matches: "briefs/\\d{4}-\\d{2}-\\d{2}\\.md$" }
  - tool: "*"
    action: block
    reason: not part of preparing your day

prompt: |
  You are Tomay. Prepare Humberto's day (use the current date and time zone from your context).

  1. List today's events on his calendars (list_calendars, then list_events for today only).
  2. For each event with at least one other attendee, search his email for recent threads with those
     people (search_threads with their addresses, last 60 days) and read the one or two most relevant
     (get_thread). Skip events with no other attendees, but keep them in the schedule.
  3. Call fs.list_allowed_directories to find the briefs folder, then write <that folder>/<YYYY-MM-DD>.md:

  # Your day — <weekday, Month D>
  ## Schedule
  One line per event: time, title, and "(prep below)" when there is a note.
  ## Free blocks
  Gaps of 45 minutes or more between 8:00 and 18:00, as times.
  ## <time> · <event title>
  For each event with others, a short note:
  - **Who:** names (and their role or company if the email makes it clear).
  - **Last time:** one or two sentences on the most recent relevant thread, with its date.
  - **Still open:** questions, promises or deadlines from those threads. Say "nothing open" if none.
  - **Bring:** anything the threads say to prepare or send. Omit if nothing.

  Keep the whole brief under 400 words. Plain, no hype. Quote nothing private beyond what a prep note
  needs. Never invent people, threads or facts; if you found no email with someone, say so.
  Do not create any other file, and do not try to change the calendar or email.
  Finally, reply with three or four lines: how many meetings, the one that needs the most preparation
  and why, and the longest free block.
