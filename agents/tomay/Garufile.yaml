# Tomay — Humberto's morning brief.
#
# Every weekday at 7:00 (your Mac's local time, via `garu ui --up`) Tomay reads
# four public sources and writes a short brief to briefs/<date>.md. It can only
# fetch from the hosts listed in the policy and can only write brief files;
# everything else is blocked outright.

name: tomay
description: Writes a short morning brief — weather, Garu repo, dev.to, AI news.
model: gemini/gemini-3.5-flash-lite

triggers:
  - cron: "0 7 * * 1-5"

budget:
  maxCostUsd: 0.05

maxTurns: 10

tools:
  - name: web
    command: node
    args: ["packages/mcp-fetch/dist/index.js"]
  - name: fs
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./agents/tomay/briefs"]

policy:
  # Reading: only these four sources, by URL.
  - tool: "web.fetch_json"
    action: allow
    when:
      url: { matches: "^https://(api\\.github\\.com/|dev\\.to/api/|hn\\.algolia\\.com/api/|api\\.open-meteo\\.com/)" }
  - tool: "web.*"
    action: block
    reason: Tomay only reads from its four known sources
  # Writing: only a dated brief inside its own folder.
  - tool: "fs.list_*"
    action: allow
  - tool: "fs.read_*"
    action: allow
  - tool: "fs.write_file"
    action: allow
    when:
      path: { matches: "briefs/\\d{4}-\\d{2}-\\d{2}\\.md$" }
  - tool: "*"
    action: block
    reason: not part of the morning brief

prompt: |
  You are Tomay. Write Humberto's morning brief for today (use the current date from your context).
  Humberto is a software engineer in Salt Lake City who builds Garu, an open-source agent runtime.

  Fetch these, as many in one turn as you can:
  1. Weather: https://api.open-meteo.com/v1/forecast?latitude=40.76&longitude=-111.89&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&temperature_unit=fahrenheit&timezone=America%2FDenver&forecast_days=1
  2. Garu repo: https://api.github.com/repos/humbertovillanueva/garu
  3. His dev.to articles: https://dev.to/api/articles?username=humbertovillanueva
  4. Hacker News front page: https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30&attributesToRetrieve=title,url,points,num_comments

  Then call fs.list_allowed_directories to get the briefs directory, and write <that directory>/<YYYY-MM-DD>.md with exactly these sections:

  # Morning brief — <weekday, Month D>
  ## Weather
  One line: high/low in °F, chance of rain, plain words for the weather code (0 clear, 1-3 partly cloudy, 45-48 fog, 51-67 rain, 71-77 snow, 80-82 showers, 95+ storms).
  ## Garu
  Stars, forks, open issues, and when it was last pushed (relative, e.g. "9 hours ago").
  ## Writing
  Each dev.to article on one line: title — reactions, comments.
  ## AI & agents on Hacker News
  Pick up to 5 front-page stories that are about AI, agents, MCP, LLMs or developer tools. One line each: title (points) — why it matters to someone building an agent runtime, in under 15 words. If fewer than 5 qualify, list fewer. Never invent stories.

  Keep the whole brief under 250 words. Plain, no hype. Do not create any other files.
  When done, reply with one sentence: the file you wrote and the single most interesting item.
