# Rook — Every Monday morning, check the Garu repo for new stars and issues.
#
# Made with `garu new`. The policy starts closed: only the tools named below,
# writes ask first, everything else blocked. Edit freely; `garu validate` checks it.

name: rook
description: "Every Monday morning, check the Garu repo for new stars and issues."
persona:
  kind: owl
  tagline: "Watches the repo so you don't have to."
model: gemini/gemini-3.5-flash-lite

triggers:
  - cron: "0 8 * * 1"        # Mondays at 8:00 local · hourly was noise while the repo is quiet

budget:
  maxCostUsd: 0.05        # a run stops before it crosses this

maxTurns: 10

tools:
  - name: github                                   # GitHub's hosted MCP server, 46 tools; the policy below exposes 3
    url: https://api.githubcopilot.com/mcp/
    headers: { Authorization: "Bearer ${GITHUB_TOKEN}" }
  - name: web
    command: node
    args: ["packages/mcp-fetch/dist/index.js"]
    env:
      WEBHOOK_URL: "${REPO_WATCH_WEBHOOK_URL}"     # Slack or Discord incoming webhook, kept in .env
  - name: fs
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./agents/rook/workspace"]

policy:
  # GitHub: three read-only tools, and only for this one repository. Everything
  # else the server offers (create issue, push files, merge…) is blocked, so the
  # model never even sees it.
  - tool: "github.list_issues"
    action: allow
    when: { owner: { eq: humbertovillanueva }, repo: { eq: garu } }
  - tool: "github.list_pull_requests"
    action: allow
    when: { owner: { eq: humbertovillanueva }, repo: { eq: garu } }
  - tool: "github.list_commits"
    action: allow
    when: { owner: { eq: humbertovillanueva }, repo: { eq: garu } }
  - tool: "github.*"
    action: block
    reason: rook only reads humbertovillanueva/garu
  # Reading: only these hosts, by URL. Add a host here to widen it.
  - tool: "web.fetch_*"
    action: allow
    when:
      url: { matches: "^https://(api\\.github\\.com)(/|$)" }
  # Posting to your channel: always ask. The model never sees or chooses the URL.
  - tool: "web.post_message"
    action: ask
    reason: posting to your channel
  - tool: "web.*"
    action: block
  # Files: the server only sees ./agents/rook/workspace. Reads are fine. Its own
  # log.md is its diary, so writing there is allowed outright (it was `ask` for the
  # first week; every ask was approved). Any other write is still reviewed.
  - tool: "fs.write_file"
    action: allow
    when: { path: { matches: "(^|/)log\\.md$" } }
  - tool: "fs.edit_file"
    action: allow
    when: { path: { matches: "(^|/)log\\.md$" } }
  - tool: "fs.list_*"
    action: allow
  - tool: "fs.read_*"
    action: allow
  - tool: "fs.get_file_info"
    action: allow
  - tool: "fs.search_files"
    action: allow
  - tool: "fs.write_file"
    action: ask
    reason: writing a file
  - tool: "fs.edit_file"
    action: ask
    reason: editing a file
  - tool: "fs.create_directory"
    action: ask
    reason: creating a folder
  - tool: "*"
    action: block
    reason: not part of Rook's job

prompt: |
  You are Rook.

  Every Monday morning, check the Garu repo for new stars and issues. Keep a dated log in your folder and tell me what changed since last week.

  The repo is humbertovillanueva/garu. Each run, in as few turns as possible:
  1. web.fetch_json https://api.github.com/repos/humbertovillanueva/garu → stargazers_count, forks_count, pushed_at.
  2. github.list_issues with owner "humbertovillanueva", repo "garu", state "OPEN" → the open issues (number, title).
  3. github.list_pull_requests with owner "humbertovillanueva", repo "garu", state "open" → the open PRs (number, title).
  4. Read log.md in your folder (fs.list_allowed_directories gives the folder; it may not exist yet).
  Then append one line to log.md: "<ISO time> — <stars> stars, <forks> forks, <N> open issues, <N> open PRs, pushed <pushed_at>".
  Compare with the previous line. Post to the channel when stars, forks, issues or PRs changed, naming new issues/PRs
  by number and title. If nothing changed, do not post — reply "no change".

  You can read from api.github.com with the web tools; read this repo's issues, PRs and commits with the github tools; read files in your folder with the fs tools (writes are reviewed first); post a message to the channel with post_message (it is reviewed first).

  Work only with the tools you are given. If a call is blocked or declined, say so briefly and continue without it; never retry the same blocked call.
  Use the current date and time from your context. Never invent facts, URLs or file contents.
  Keep replies short and concrete: what you did, what you found, anything that needs a human.
