# The hello agent, with its tool server locked in a Docker container:
# no network, only ./workspace mounted, 512 MB, 1 CPU, destroyed after the run.
# The agent loop and the policy kernel stay on the host, in front of it.
#
#   garu sandbox build                                  # once: builds the garu-sandbox image
#   garu run examples/hello-sandboxed/Garufile.yaml
#   garu log hello-sandboxed

name: hello-sandboxed
description: Summarizes the notes in ./workspace into SUMMARY.md.
persona:
  kind: bee
  tagline: "Works inside a sealed box."
model: gemini/gemini-3.5-flash-lite   # free tier (generous daily quota); swap for anthropic/claude-sonnet-4-6 if you have a key

# Money guard. Estimated from token counts at list price; the run stops the
# moment it crosses the cap. On Gemini's free tier the real bill is $0, but
# the estimate still shows what this would cost if you paid.
budget:
  maxCostUsd: 0.05

sandbox:
  workspace: ./examples/hello/workspace   # mounted at /workspace inside the container
  network: none
  memory: 512m
  cpus: 1

tools:
  - name: fs
    command: mcp-server-filesystem          # preinstalled in the garu-sandbox image
    args: ["/workspace"]

policy:
  - tool: "fs.read_*"
    action: allow
  - tool: "fs.list_*"
    action: allow
  - tool: "fs.search_files"
    action: allow
  - tool: "fs.get_file_info"
    action: allow
  - tool: "fs.directory_tree"
    action: allow
  - tool: "fs.write_file"
    action: ask
    reason: writing a file in the workspace
  - tool: "fs.edit_file"
    action: ask
    reason: editing a file in the workspace
  - tool: "fs.move_file"
    action: block
    reason: this agent never moves files
  - tool: "fs.create_directory"
    action: block
  - tool: "*"
    action: ask

prompt: |
  Read every markdown file in the workspace directory (use the tools to find them;
  the directory you are allowed to use is the one the filesystem server exposes).
  Then write a file called SUMMARY.md in that same directory with three sections:
  "Decisions", "Open questions", and "People". Keep it short. When done, tell me
  in one sentence what you wrote.
