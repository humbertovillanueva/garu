# An always-on agent. Every three hours it checks the workspace and appends one
# line to tick.log saying what's there. Tiny on purpose: it exists to show
# `garu up` keeping an agent alive on a schedule, with every run in the log.
#
#   garu up examples/tick/Garufile.yaml
#   garu log tick
#
# Its one write is its whole job, so it's `allow` — an agent that asks you eight
# times a day is noise, not safety. Anything outside tick.log is blocked.

name: tick
description: Appends a one-line status to tick.log on a schedule.
persona:
  kind: turtle
  tagline: "Slow, steady, never misses a beat."
model: gemini/gemini-3.5-flash-lite

triggers:
  - cron: "0 */3 * * *"      # eight beats a day prove the schedule as well as 24 did, with a third of the log

budget:
  maxCostUsd: 0.01          # per run; every three hours is ~240 runs a month, under $3 at list price even if every run hit the cap

tools:
  - name: fs
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./examples/tick/workspace"]

policy:
  - tool: "fs.list_*"
    action: allow
  - tool: "fs.read_*"
    action: allow
  - tool: "fs.write_file"
    action: allow
    when:
      path: { matches: "tick\\.log$" }
  - tool: "*"
    action: block

maxTurns: 8

prompt: |
  Look at the files in the allowed directory. If tick.log exists, read it.
  Then write tick.log back with its last 30 lines (fewer if it has fewer) plus ONE new line at the end
  in the form "<ISO timestamp> — <N> file(s): <comma-separated names>". Older lines are dropped: the
  log is a heartbeat, not a history, and a file that only grew would one day be too long to write back.
  Do nothing else.
  Reply with one short sentence for a person, comparing with the previous line: what changed, or that
  nothing did, e.g. "Nothing new: 2 files." or "1 new file: notes.md." No timestamps: the control room
  already shows when it ran.
